<!-- ScheduleDefinition Component -->

<div class="schedule-definition">
  <form [formGroup]="form">

    <!-- ── Schedule: Start Date/Time + Duration (inline) ───────────────── -->
    <div class="flex flex-wrap items-end gap-3 mb-4">
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-medium text-gray-500 mb-1">
          Schedule <span class="text-red-500">*</span>
        </label>
        <input
          type="datetime-local"
          formControlName="dtstart"
          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="form.get('dtstart')?.invalid && form.get('dtstart')?.touched">
        <p class="mt-1 text-xs text-red-600"
           *ngIf="form.get('dtstart')?.invalid && form.get('dtstart')?.touched">
          Start date is required
        </p>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Duration (seconds)</label>
        <div class="flex items-center gap-2">
          <input
            type="number"
            formControlName="durationSeconds"
            min="60"
            step="300"
            placeholder="3600"
            class="w-28 px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <span class="text-xs text-gray-400">
            {{ (form.get('durationSeconds')?.value || 0) / 3600 | number:'1.0-1' }} hour(s)
          </span>
        </div>
      </div>
    </div>

    <!-- ── Is this recurring? ────────────────────────────────────────────── -->
    <div class="mb-4">
      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [checked]="isRecurring"
          (change)="onIsRecurringChange($event)"
          class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
        <span class="text-sm font-medium text-gray-700">Is this recurring?</span>
      </label>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!--  Recurrence configuration (shown only when isRecurring)            -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div *ngIf="isRecurring" class="border border-gray-200 rounded-md p-4 bg-gray-50 space-y-4">

      <!-- ── Repeat row ──────────────────────────────────────────────────── -->
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm font-medium text-gray-700 w-16 shrink-0">Repeat:</label>
        <select
          formControlName="freqUnit"
          class="px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
          <option value="daily">Day(s)</option>
          <option value="weekly">Week(s)</option>
          <option value="monthly">Month(s)</option>
          <option value="yearly">Year(s)</option>
        </select>
        <span class="text-sm text-gray-600">Every</span>
        <input
          type="number"
          formControlName="interval"
          min="1"
          class="w-16 px-2 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-center">
        <span class="text-sm text-gray-600">{{ freqUnitLabel }}</span>
      </div>

      <!-- ── Weekly: weekday picker ──────────────────────────────────────── -->
      <div *ngIf="form.get('freqUnit')?.value === 'weekly'"
           class="flex flex-wrap items-center gap-2 pl-[72px]">
        <app-weekday-picker
          [selectedDays]="weekDays"
          (selectedDaysChange)="onWeekDaysChange($event)">
        </app-weekday-picker>
      </div>

      <!-- ── Monthly options ─────────────────────────────────────────────── -->
      <div *ngIf="form.get('freqUnit')?.value === 'monthly'" class="space-y-3 pl-[72px]">

        <!-- Radio: Arbitrary / Ordinal -->
        <div class="flex flex-wrap gap-4">
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="monthlyMode"
              value="arbitrary"
              [checked]="monthlyMode === 'arbitrary'"
              (change)="onMonthlyModeChange('arbitrary')"
              class="text-blue-600">
            <span class="text-sm text-gray-700">Pick Arbitrary Day(s)</span>
          </label>
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="monthlyMode"
              value="ordinal"
              [checked]="monthlyMode === 'ordinal'"
              (change)="onMonthlyModeChange('ordinal')"
              class="text-blue-600">
            <span class="text-sm text-gray-700">Pick Ordinally</span>
          </label>
        </div>

        <!-- Arbitrary: 1–31 numbered buttons -->
        <div *ngIf="monthlyMode === 'arbitrary'" class="flex flex-wrap gap-1.5 mt-2">
          <button
            *ngFor="let d of daysInMonthOptions"
            type="button"
            (click)="toggleMonthDay(d)"
            class="w-8 h-8 text-xs rounded-full border transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
            [class.bg-blue-600]="isMonthDaySelected(d)"
            [class.text-white]="isMonthDaySelected(d)"
            [class.border-blue-600]="isMonthDaySelected(d)"
            [class.bg-white]="!isMonthDaySelected(d)"
            [class.text-gray-700]="!isMonthDaySelected(d)"
            [class.border-gray-300]="!isMonthDaySelected(d)">
            {{ d }}
          </button>
        </div>

        <!-- Ordinal: ordinal select + weekday picker -->
        <div *ngIf="monthlyMode === 'ordinal'" class="flex flex-wrap items-center gap-2 mt-2">
          <span class="text-sm text-gray-700">On the</span>
          <select
            formControlName="monthlyOrdinal"
            class="px-2 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option *ngFor="let o of ordinalOptions" [value]="o.value">{{ o.label }}</option>
          </select>
          <app-weekday-picker
            [selectedDays]="monthlyWeekdays"
            (selectedDaysChange)="onMonthlyWeekdaysChange($event)">
          </app-weekday-picker>
        </div>

      </div>

      <!-- ── Yearly options ──────────────────────────────────────────────── -->
      <div *ngIf="form.get('freqUnit')?.value === 'yearly'" class="space-y-3 pl-[72px]">

        <!-- Month select -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-sm text-gray-700">In</span>
          <select
            formControlName="yearlyMonth"
            class="px-2 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option *ngFor="let m of monthNames; let i = index" [value]="i + 1">{{ m }}</option>
          </select>
        </div>

        <!-- Day of month -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            name="yearlyMode"
            value="day"
            [checked]="yearlyMode === 'day'"
            (change)="onYearlyModeChange('day')"
            class="text-blue-600 mt-0.5">
          <span class="text-sm text-gray-700">Day</span>
          <select
            formControlName="yearlyDay"
            [attr.disabled]="yearlyMode !== 'day' ? true : null"
            class="px-2 py-1 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white disabled:bg-gray-50 disabled:text-gray-400">
            <option *ngFor="let d of daysInMonthOptions" [value]="d">{{ d }}</option>
          </select>
          <span class="text-sm text-gray-500">of the month</span>
        </label>

        <!-- Ordinal weekday -->
        <label class="flex items-start gap-2 cursor-pointer">
          <input
            type="radio"
            name="yearlyMode"
            value="ordinal"
            [checked]="yearlyMode === 'ordinal'"
            (change)="onYearlyModeChange('ordinal')"
            class="text-blue-600 mt-2.5">
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <span class="text-sm text-gray-700">The</span>
              <select
                formControlName="yearlyOrdinal"
                [attr.disabled]="yearlyMode !== 'ordinal' ? true : null"
                class="px-2 py-1 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white disabled:bg-gray-50 disabled:text-gray-400">
                <option *ngFor="let o of ordinalOptions" [value]="o.value">{{ o.label }}</option>
              </select>
              <span class="text-sm text-gray-500">weekday(s)</span>
            </div>
            <div [class.opacity-40]="yearlyMode !== 'ordinal'"
                 [class.pointer-events-none]="yearlyMode !== 'ordinal'">
              <app-weekday-picker
                [selectedDays]="yearlyWeekdays"
                (selectedDaysChange)="onYearlyWeekdaysChange($event)">
              </app-weekday-picker>
            </div>
          </div>
        </label>

      </div>

      <!-- ── Ends ────────────────────────────────────────────────────────── -->
      <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-gray-200">
        <label class="text-sm font-medium text-gray-700 w-16 shrink-0">Ends:</label>
        <select
          formControlName="endType"
          class="px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
          <option value="never">Never</option>
          <option value="on">On</option>
          <option value="after">After</option>
        </select>
        <input
          *ngIf="form.get('endType')?.value === 'on'"
          type="date"
          formControlName="endDate"
          class="px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <ng-container *ngIf="form.get('endType')?.value === 'after'">
          <input
            type="number"
            formControlName="endCount"
            min="1"
            class="w-20 px-2 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-center">
          <span class="text-sm text-gray-600">occurrence(s)</span>
        </ng-container>
      </div>

    </div>
    <!-- end recurring block -->

    <!-- ── Frequency summary badge ──────────────────────────────────────── -->
    <div *ngIf="frequencyLabel && frequencyLabel !== 'Does not repeat'" class="mt-3 mb-1">
      <div class="flex items-center gap-2 text-xs text-blue-700 bg-blue-50 border border-blue-200 rounded-md px-2.5 py-1.5">
        <i class="bi bi-arrow-repeat shrink-0"></i>
        <span class="flex-1 leading-snug">{{ frequencyLabel }}</span>
      </div>
    </div>

    <!-- ── RRULE badge ──────────────────────────────────────────────────── -->
    <div *ngIf="isRecurring && currentRRule" class="mt-2 mb-4">
      <div class="flex items-center gap-2 text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-md px-3 py-2">
        <i class="bi bi-code-slash text-blue-400"></i>
        <span class="font-mono break-all">{{ currentRRule }}</span>
      </div>
    </div>

  </form>

  <!-- ── Occurrence Preview ──────────────────────────────────────────────── -->
  <div *ngIf="showPreview && isRecurring" class="mt-2">
    <app-occurrence-preview
      [rruleString]="currentRRule"
      [dtstart]="dtstartFull"
      [count]="previewCount"
      [exdates]="exdatesArray"
      (toggleExdate)="onToggleExdate($event)">
    </app-occurrence-preview>
  </div>

</div>
