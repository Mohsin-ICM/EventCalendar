name: ci

on:
  push:
    branches: [ "main", "master", "demo_event" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore EventCalendarService.sln
      - name: Build
        run: dotnet build EventCalendarService.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test EventCalendarService.sln --configuration Release --no-build
